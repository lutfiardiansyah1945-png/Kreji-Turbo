              private fun addRr() {
                  pickOne("Pilih aplikasi") { a ->
                      @Suppress("DEPRECATION")
                      val rates = windowManager.defaultDisplay.supportedModes
                          .map { it.refreshRate.roundToInt() }.distinct().sorted()
                      AlertDialog.Builder(this)
