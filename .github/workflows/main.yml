          package com.lutfikreji.krejiturbo

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.widget.RemoteViews
          import rikka.shizuku.Shizuku

          /** Akses shell lewat Shizuku, dipakai oleh Activity, alarm, dan widget. */
          object Sh {
              /** 0 = mati, 1 = belum diizinkan, 2 = aktif */
              fun state(): Int = try {
                  if (!Shizuku.pingBinder()) 0
                  else if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) 2
                  else 1
              } catch (e: Throwable) {
                  0
              }

              fun waitReady(ms: Long): Boolean {
                  val end = SystemClock.elapsedRealtime() + ms
                  while (SystemClock.elapsedRealtime() < end) {
                      if (state() == 2) return true
                      try { Thread.sleep(300) } catch (e: InterruptedException) { break }
                  }
                  return state() == 2
              }

              fun exec(cmd: String): String {
                  return try {
                      if (state() != 2) return "ERR: Shizuku belum aktif"
                      val m = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      m.isAccessible = true
                      val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                      val out = p.inputStream.bufferedReader().readText()
                      val err = p.errorStream.bufferedReader().readText()
                      p.waitFor()
                      (out + err).trim()
                  } catch (e: Throwable) {
                      "ERR: ${e.cause?.message ?: e.message}"
                  }
              }

              /** Boost sekarang: tutup proses latar yang aman dan bersihkan cache semua aplikasi. */
              fun boostNow(): String = exec("am kill-all; pm trim-caches 999G; echo done")

              /** Paket aplikasi yang sedang di layar (fokus jendela). */
              fun foregroundPkg(): String {
                  val out = exec("dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'")
                  val m = Regex(" u\\d+ ([A-Za-z0-9_.]+)/").find(out)
                  return m?.groupValues?.get(1) ?: ""
              }

              /** Atur refresh rate (Hz), atau null untuk kembali ke bawaan sistem. */
              fun setRefresh(hz: Int?): String =
                  if (hz == null) exec("settings delete system min_refresh_rate; settings delete system peak_refresh_rate")
                  else exec("settings put system min_refresh_rate $hz; settings put system peak_refresh_rate $hz")
          }

          /** "pkg=90;pkg2=60" menjadi peta paket ke Hz. */
          fun parseRr(s: String?): LinkedHashMap<String, Int> {
              val m = LinkedHashMap<String, Int>()
              s.orEmpty().split(";").forEach { part ->
                  val kv = part.split("=")
                  if (kv.size == 2) kv[1].toIntOrNull()?.let { m[kv[0]] = it }
              }
              return m
          }

          /** Alarm berkala: bersihkan cache otomatis tiap X jam. */
          class AutoReceiver : BroadcastReceiver() {
              companion object {
                  const val ACT = "com.lutfikreji.krejiturbo.AUTO_CLEAN"

                  fun schedule(ctx: Context) {
                      val am = ctx.getSystemService(AlarmManager::class.java)
                      val pi = PendingIntent.getBroadcast(
                          ctx, 1,
                          Intent(ctx, AutoReceiver::class.java).setAction(ACT),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val p = ctx.getSharedPreferences("kreji", Context.MODE_PRIVATE)
                      am.cancel(pi)
                      if (p.getBoolean("auto", false)) {
                          val ms = p.getInt("hours", 6) * 3600_000L
                          am.setInexactRepeating(
                              AlarmManager.ELAPSED_REALTIME,
                              SystemClock.elapsedRealtime() + ms,
                              ms,
                              pi
                          )
                      }
                  }
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  if (intent.action != ACT) return
                  val pr = goAsync()
                  Thread {
                      try {
                          val r = if (Sh.waitReady(6000)) Sh.exec("pm trim-caches 999G; echo done") else "ERR: Shizuku mati"
                          ctx.getSharedPreferences("kreji", Context.MODE_PRIVATE).edit()
                              .putLong("last_clean", System.currentTimeMillis())
                              .putString("last_res", if (r.startsWith("ERR")) "Gagal" else "Berhasil")
                              .apply()
                      } finally {
                          pr.finish()
                      }
                  }.start()
              }
          }

          /** Jadwalkan ulang alarm setelah HP restart. */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      AutoReceiver.schedule(ctx)
                      TurboService.sync(ctx)
                  }
              }
          }

          /** Widget satu tombol "Boost sekarang". */
          class BoostWidget : AppWidgetProvider() {
              companion object {
                  const val ACT = "com.lutfikreji.krejiturbo.BOOST_NOW"
              }

              private fun views(ctx: Context, text: String): RemoteViews {
                  val rv = RemoteViews(ctx.packageName, R.layout.widget_boost)
                  rv.setTextViewText(R.id.widget_btn, text)
                  val pi = PendingIntent.getBroadcast(
                      ctx, 2,
                      Intent(ctx, BoostWidget::class.java).setAction(ACT),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  rv.setOnClickPendingIntent(R.id.widget_btn, pi)
                  return rv
              }

              override fun onUpdate(ctx: Context, m: AppWidgetManager, ids: IntArray) {
                  ids.forEach { m.updateAppWidget(it, views(ctx, "Boost sekarang")) }
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  super.onReceive(ctx, intent)
                  if (intent.action != ACT) return
                  val pr = goAsync()
                  val m = AppWidgetManager.getInstance(ctx)
                  val ids = m.getAppWidgetIds(ComponentName(ctx, BoostWidget::class.java))
                  fun set(t: String) {
                      ids.forEach { m.updateAppWidget(it, views(ctx, t)) }
                  }
                  Thread {
                      var finished = false
                      try {
                          set("Memproses...")
                          val ok = Sh.waitReady(6000)
                          val r = if (ok) Sh.boostNow() else "ERR"
                          set(if (ok && !r.startsWith("ERR")) "Selesai" else "Shizuku mati")
                          pr.finish()
                          finished = true
                          Thread.sleep(3000)
                          set("Boost sekarang")
                      } catch (e: Throwable) {
                      } finally {
                          if (!finished) pr.finish()
                      }
                  }.start()
              }
          }

          /** Layanan latar: auto-stop saat layar mati, auto compact, dan profil refresh rate per aplikasi. */
          class TurboService : Service() {
              companion object {
                  const val CH = "kreji_service"

                  fun sync(ctx: Context) {
                      val p = ctx.getSharedPreferences("kreji", Context.MODE_PRIVATE)
                      val need = p.getBoolean("autostop", false) || p.getBoolean("autocompact", false) || p.getBoolean("rrauto", false)
                      val i = Intent(ctx, TurboService::class.java)
                      try {
                          if (need) ctx.startForegroundService(i) else ctx.stopService(i)
                      } catch (e: Throwable) {
                      }
                  }
              }

              private lateinit var worker: HandlerThread
              private lateinit var h: Handler
              @Volatile private var screenOn = true
              private var lastPkg = ""
              private var lastCompact = 0L
              private var rrApplied = false
              private val prefs by lazy { getSharedPreferences("kreji", Context.MODE_PRIVATE) }

              private val rx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      when (i.action) {
                          Intent.ACTION_SCREEN_OFF -> {
                              screenOn = false
                              h.post { onScreenOff() }
                          }
                          Intent.ACTION_SCREEN_ON -> screenOn = true
                      }
                  }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      try { work() } catch (e: Throwable) {}
                      h.postDelayed(this, 3000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  worker = HandlerThread("turbo-worker")
                  worker.start()
                  h = Handler(worker.looper)
                  startFg()
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_SCREEN_ON)
                  }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(rx, f)
                  h.postDelayed(tick, 3000)
              }

              override fun onDestroy() {
                  try { unregisterReceiver(rx) } catch (e: Throwable) {}
                  h.removeCallbacksAndMessages(null)
                  if (rrApplied) Thread { Sh.setRefresh(null) }.start()
                  worker.quitSafely()
                  super.onDestroy()
              }

              private fun startFg() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CH, "Layanan Kreji Turbo", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Kreji Turbo aktif")
                      .setContentText("Fitur otomatis sedang berjalan di latar belakang")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              private fun safe(set: Set<String>): List<String> {
                  val ok = Regex("[A-Za-z0-9_.]+")
                  return set.filter { ok.matches(it) }
              }

              private fun onScreenOff() {
                  if (prefs.getBoolean("autostop", false) && Sh.state() == 2) {
                      val pk = safe(prefs.getStringSet("stop_pkgs", emptySet()) ?: emptySet())
                      Sh.exec("am kill-all" + pk.joinToString("") { "; am force-stop $it" })
                  }
                  if (rrApplied) {
                      Sh.setRefresh(null)
                      rrApplied = false
                      lastPkg = ""
                  }
              }

              private fun work() {
                  if (!screenOn || Sh.state() != 2) return
                  val rr = prefs.getBoolean("rrauto", false)
                  val cp = prefs.getBoolean("autocompact", false)
                  if (!rr && rrApplied) {
                      Sh.setRefresh(null)
                      rrApplied = false
                  }
                  if (!rr && !cp) return
                  val pkg = Sh.foregroundPkg()
                  if (pkg.isEmpty()) return
                  if (rr && pkg != lastPkg) {
                      val hz = parseRr(prefs.getString("rr_map", ""))[pkg]
                      if (hz != null) {
                          Sh.setRefresh(hz)
                          rrApplied = true
                      } else if (rrApplied) {
                          Sh.setRefresh(null)
                          rrApplied = false
                      }
                  }
                  lastPkg = pkg
                  val now = System.currentTimeMillis()
                  if (cp && pkg != packageName && now - lastCompact > 300000L && Regex("[A-Za-z0-9_.]+").matches(pkg)) {
                      Sh.exec("am compact full $pkg 0")
                      lastCompact = now
                  }
              }
          }
