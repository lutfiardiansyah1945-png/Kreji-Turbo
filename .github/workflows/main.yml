              // ---- daftar aplikasi ----

              private fun loadApps() {
                  Thread {
                      val pm = packageManager
                      val list = pm.getInstalledApplications(0)
                          .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && it.packageName != packageName }
                          .map { ai ->
                              var size = File(ai.sourceDir).length()
                              (ai.splitSourceDirs ?: emptyArray()).forEach { size += File(it).length() }
                              AppItem(pm.getApplicationLabel(ai).toString(), ai.packageName, size)
                          }
                          .sortedBy { it.label.lowercase() }
                      apps = list
                      runOnUiThread { renderApps() }
                  }.start()
              }

              private fun fmt(b: Long): String = when {
                  b >= 1L shl 30 -> String.format(Locale.US, "%.1f GB", b / 1073741824.0)
                  b >= 1L shl 20 -> String.format(Locale.US, "%.0f MB", b / 1048576.0)
                  else -> String.format(Locale.US, "%d KB", b / 1024)
              }

              private fun renderApps() {
                  appBox.removeAllViews()
                  val q = search.text.toString().trim().lowercase()
                  val filtered = apps.filter { q.isEmpty() || it.label.lowercase().contains(q) || it.pkg.contains(q) }
                  if (filtered.isEmpty()) {
                      appBox.addView(
                          tv(if (apps.isEmpty()) "Memuat daftar aplikasi" else "Tidak ada aplikasi yang cocok", 13f, cMuted)
                              .apply { setPadding(0, dp(12), 0, 0) }
                      )
                      return
                  }
                  filtered.take(40).forEachIndexed { idx, a ->
                      if (idx > 0) {
                          appBox.addView(View(this).apply { setBackgroundColor(cLine) }, LinearLayout.LayoutParams(MATCH, dp(1)))
                      }
                      val r = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(2), dp(11), dp(2), dp(11))
                          setOnClickListener { appDialog(a) }
                      }
                      val ic = ImageView(this)
                      try { ic.setImageDrawable(packageManager.getApplicationIcon(a.pkg)) } catch (e: Throwable) {}
                      r.addView(ic, LinearLayout.LayoutParams(dp(42), dp(42)))
                      val mid = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(tv(a.label, 14f, cInk, true).apply { setSingleLine(); ellipsize = TextUtils.TruncateAt.END })
                          addView(tv("${fmt(a.size)}  ·  ${a.pkg}", 11f, cMuted).apply { setSingleLine(); ellipsize = TextUtils.TruncateAt.END })
                      }
                      r.addView(mid, LinearLayout.LayoutParams(0, WRAP, 1f).apply { leftMargin = dp(12); rightMargin = dp(8) })
                      r.addView(btn("Info", false) { openAppInfo(a.pkg) }.apply {
                          textSize = 12f
                          setPadding(dp(14), dp(8), dp(14), dp(8))
                      })
                      appBox.addView(r)
                  }
                  if (filtered.size > 40) {
                      appBox.addView(
                          tv("Menampilkan 40 dari ${filtered.size} aplikasi. Gunakan pencarian untuk menemukan yang lain.", 11f, cMuted)
                              .apply { setPadding(0, dp(12), 0, 0) }
                      )
                  }
              }

              private fun openAppInfo(pkg: String) =
                  openIntent(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")))

              private fun appDialog(a: AppItem) {
                  AlertDialog.Builder(this)
                      .setTitle(a.label)
                      .setItems(arrayOf("Bersihkan cache", "Boost (stop paksa lalu buka ulang)", "Info aplikasi")) { _, w ->
                          when (w) {
                              0 -> clearCache(a)
                              1 -> boost(a)
                              2 -> openAppInfo(a.pkg)
                          }
                      }
                      .show()
              }

              private fun clearCache(a: AppItem) {
                  val p = a.pkg
                  runSh(
                      "rm -rf /sdcard/Android/data/$p/cache/* /sdcard/Android/data/$p/code_cache/* /sdcard/Android/media/$p/cache/* 2>/dev/null; echo done",
                      "Cache ${a.label} dibersihkan"
                  )
              }

              private fun boost(a: AppItem) {
                  runShRaw("am force-stop ${a.pkg}") { r ->
                      if (r.startsWith("ERR")) toast(r) else {
                          val i = packageManager.getLaunchIntentForPackage(a.pkg)
                          if (i != null) {
                              toast("${a.label} di-boost")
                              startActivity(i)
                          } else toast("Aplikasi dihentikan, tapi tidak bisa dibuka ulang")
                      }
                  }
              }

              // ======================= Turbo: helper =======================

              private fun labelOf(pkg: String): String = apps.firstOrNull { it.pkg == pkg }?.label ?: pkg

              private fun pkgSet(key: String): MutableSet<String> =
                  HashSet<String>(prefs.getStringSet(key, emptySet<String>()) ?: emptySet<String>())

              private fun safePkgs(key: String): List<String> {
                  val ok = Regex("[A-Za-z0-9_.]+")
                  return pkgSet(key).filter { ok.matches(it) }
              }

              private fun pickRow(title: String, key: String, btnLabel: String, onClick: () -> Unit): LinearLayout {
                  val row = actionRow(title, "", btnLabel) { onClick() }
                  val desc = (row.getChildAt(0) as LinearLayout).getChildAt(1) as TextView
                  sums[key] = desc
                  return row
              }

              private fun refreshSums() {
                  sums.forEach { (key, view) ->
                      val set = pkgSet(key)
                      view.text = if (set.isEmpty()) "Belum ada yang dipilih"
                      else "${set.size} dipilih: " + set.take(3).joinToString(", ") { labelOf(it) } + (if (set.size > 3) " ..." else "")
                  }
              }

              private fun pickApps(title: String, key: String) {
                  if (apps.isEmpty()) {
                      toast("Daftar aplikasi belum siap, coba lagi sebentar")
                      return
                  }
                  val list = apps
                  val cur = pkgSet(key)
                  val checked = BooleanArray(list.size) { cur.contains(list[it].pkg) }
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setMultiChoiceItems(list.map { it.label }.toTypedArray(), checked) { _, i, on -> checked[i] = on }
                      .setPositiveButton("Simpan") { _, _ ->
                          val set = HashSet<String>()
                          list.forEachIndexed { i, a -> if (checked[i]) set.add(a.pkg) }
                          prefs.edit().putStringSet(key, set).apply()
                          refreshSums()
                      }
                      .setNegativeButton("Batal", null)
                      .show()
              }

              private fun pickOne(title: String, onPick: (AppItem) -> Unit) {
                  if (apps.isEmpty()) {
                      toast("Daftar aplikasi belum siap, coba lagi sebentar")
                      return
                  }
                  val list = apps
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setItems(list.map { it.label }.toTypedArray()) { _, i -> onPick(list[i]) }
                      .setNegativeButton("Batal", null)
                      .show()
              }

              private fun twoBtns(aLabel: String, aClick: () -> Unit, bLabel: String, bClick: () -> Unit): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(btn(aLabel, true, aClick), LinearLayout.LayoutParams(0, WRAP, 1f))
