              private fun gb(b: Long): String = String.format(Locale.US, "%.1f GB", b / 1073741824.0)

              private fun loadHeavy(force: Boolean) {
                  if (state() != 2) {
                      renderHeavy("Aktifkan Shizuku untuk melihat daftar aplikasi")
                      return
                  }
                  if (!force && heavy.isNotEmpty() && System.currentTimeMillis() - heavyAt < 20000) return
                  renderHeavy("Memuat daftar...")
                  Thread {
                      val out = sh("dumpsys meminfo")
                      val map = HashMap<String, Int>()
                      val rx = Regex("^\\s*([\\d.,]+)K:\\s+(\\S+)\\s+\\(pid")
                      var inPss = false
                      out.lineSequence().forEach { ln ->
                          if (ln.startsWith("Total PSS by process")) inPss = true
                          else if (ln.startsWith("Total PSS by OOM")) inPss = false
                          else if (inPss) {
                              val m = rx.find(ln)
                              if (m != null) {
                                  val kb = m.groupValues[1].replace(Regex("[^0-9]"), "").toLongOrNull() ?: 0L
                                  val pkg = m.groupValues[2].substringBefore(':')
                                  map[pkg] = (map[pkg] ?: 0) + (kb / 1024).toInt()
                              }
                          }
                      }
                      val pm = packageManager
                      val list = map.entries.mapNotNull { e ->
                          try {
                              val ai = pm.getApplicationInfo(e.key, 0)
                              if ((ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0 || e.key == packageName) null
                              else Heavy(pm.getApplicationLabel(ai).toString(), e.key, e.value)
                          } catch (t: Throwable) {
                              null
                          }
                      }.sortedByDescending { it.mb }.take(12)
                      heavy = list
                      heavyAt = System.currentTimeMillis()
                      runOnUiThread { renderHeavy(null) }
                  }.start()
              }

              private fun renderHeavy(msg: String?) {
                  if (!::heavyBox.isInitialized) return
                  try {
                      val mi = ActivityManager.MemoryInfo()
                      getSystemService(ActivityManager::class.java).getMemoryInfo(mi)
                      vRam.text = "RAM bebas ${gb(mi.availMem)} dari ${gb(mi.totalMem)}"
                  } catch (e: Throwable) {
                  }
                  heavyBox.removeAllViews()
                  if (msg != null || heavy.isEmpty()) {
                      heavyBox.addView(tv(msg ?: "Tidak ada aplikasi pengguna yang berjalan di latar belakang", 13f, cMuted).apply {
                          setPadding(0, dp(10), 0, 0)
                      })
                      return
                  }
                  heavy.forEachIndexed { idx, a ->
                      if (idx > 0) heavyBox.addView(View(this).apply { setBackgroundColor(cLine) }, LinearLayout.LayoutParams(MATCH, dp(1)))
                      val r = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(2), dp(10), dp(2), dp(10))
                      }
                      val ic = ImageView(this)
                      try { ic.setImageDrawable(packageManager.getApplicationIcon(a.pkg)) } catch (e: Throwable) {}
                      r.addView(ic, LinearLayout.LayoutParams(dp(40), dp(40)))
                      val mid = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(tv(a.label, 14f, cInk, true).apply { setSingleLine(); ellipsize = TextUtils.TruncateAt.END })
                          addView(tv("${a.mb} MB", 12f, cMuted))
                      }
                      r.addView(mid, LinearLayout.LayoutParams(0, WRAP, 1f).apply { leftMargin = dp(12); rightMargin = dp(8) })
                      r.addView(btn("Stop") {
                          runSh("am force-stop ${a.pkg}", "${a.label} dihentikan") {
                              heavy = heavy.filter { it.pkg != a.pkg }
                              renderHeavy(null)
                          }
                      }.apply {
                          textSize = 12f
                          setPadding(dp(16), dp(8), dp(16), dp(8))
                      })
                      heavyBox.addView(r)
                  }
              }

