              private fun applySet(key: String, template: String, ok: String) {
                  val l = safePkgs(key)
                  if (l.isEmpty()) {
                      toast("Pilih aplikasi dulu")
                      return
                  }
                  runSh(l.joinToString("; ") { template.replace("%p", it) }, ok)
              }

