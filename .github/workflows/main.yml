              private fun refreshTools() {
                  if (!::chAnim.isInitialized) return
                  try {
                      val a = Settings.Global.getFloat(contentResolver, "window_animation_scale", 1f)
                      mark(chAnim, if (a == 1f) 0 else if (a == 0.5f) 1 else -1)

                      val lp = Settings.Global.getInt(contentResolver, "low_power", 0)
                      mark(chSaver, if (lp == 1) 0 else 1)

                      val t = Settings.System.getInt(contentResolver, "screen_off_timeout", -1)
                      mark(chTimeout, timeouts.indexOf(t))

                      val bv = Settings.System.getInt(contentResolver, "screen_brightness", -1)
                      var best = -1
                      var diff = 24
                      brights.forEachIndexed { i, p -> if (abs(p - bv) < diff) { diff = abs(p - bv); best = i } }
                      mark(chBright, best)

                      swScan.isChecked = Settings.Global.getInt(contentResolver, "wifi_scan_always_enabled", 1) == 0 &&
                          Settings.Global.getInt(contentResolver, "ble_scan_always_enabled", 1) == 0
                      swNetRec.isChecked = Settings.Global.getInt(contentResolver, "network_recommendations_enabled", 1) == 0
                      swWifiSus.isChecked = Settings.Global.getInt(contentResolver, "wifi_suspend_optimizations_enabled", 1) == 0
                      swHw.isChecked = prefs.getBoolean("hwoverlay", false)
                      swAutoStop.isChecked = prefs.getBoolean("autostop", false)
                      swAutoCompact.isChecked = prefs.getBoolean("autocompact", false)
                      swRr.isChecked = prefs.getBoolean("rrauto", false)
                      mark(chPointer, longPress.indexOf(Settings.Secure.getInt(contentResolver, "long_press_timeout", 400)))
                      refreshSums()
                      renderRr()
                      swCaptive.isChecked = Settings.Global.getInt(contentResolver, "captive_portal_mode", 1) == 0
                      swAuto.isChecked = prefs.getBoolean("auto", false)
                      mark(chHours, listOf(1, 3, 6, 12).indexOf(prefs.getInt("hours", 6)))
                      val last = prefs.getLong("last_clean", 0L)
                      vLast.text = if (last == 0L) "Belum pernah berjalan otomatis"
                      else "Terakhir: " + SimpleDateFormat("dd MMM HH:mm", Locale("id")).format(Date(last)) +
                          " (" + prefs.getString("last_res", "-") + ")"
                  } catch (e: Throwable) {
                  }
              }

