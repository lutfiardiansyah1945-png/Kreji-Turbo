name: Build Kreji Turbo APK (all-in-one)

# Satu file ini sudah berisi SEMUA kode aplikasi Kreji Turbo.
# Taruh di repo sebagai .github/workflows/build.yml, lalu jalankan dari tab Actions.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Buat semua file proyek
        run: |
          set -e
          mkdir -p KrejiTurbo && cd KrejiTurbo
          mkdir -p .
          cat > build.gradle.kts <<'KREJI_EOF_0'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          KREJI_EOF_0
          mkdir -p .
          cat > gradle.properties <<'KREJI_EOF_1'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          KREJI_EOF_1
          mkdir -p .
          cat > settings.gradle.kts <<'KREJI_EOF_2'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KrejiTurbo"
          include(":app")
          KREJI_EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'KREJI_EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lutfikreji.krejiturbo"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lutfikreji.krejiturbo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          KREJI_EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KREJI_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Kreji Turbo"
                  android:theme="@style/AppTheme">

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TurboService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Pemantauan layar dan aplikasi aktif untuk optimasi otomatis" />
                  </service>

                  <receiver
                      android:name=".AutoReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".BoostWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/boost_widget_info" />
                  </receiver>
              </application>
          </manifest>
          KREJI_EOF_4
          mkdir -p app/src/main/java/com/lutfikreji/krejiturbo
          cat > app/src/main/java/com/lutfikreji/krejiturbo/MainActivity.kt <<'KREJI_EOF_5'
          package com.lutfikreji.krejiturbo

          import android.app.Activity
          import android.app.ActivityManager
          import android.app.AlertDialog
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import rikka.shizuku.Shizuku
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          data class AppItem(val label: String, val pkg: String, val size: Long)

          class MainActivity : Activity() {

              companion object {
                  const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
                  const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
                  const val CH = "kreji_shizuku"
                  const val TIKTOK = "https://www.tiktok.com/@lutfikreji"
                  const val WA = "https://whatsapp.com/channel/0029Vb8BjUO6WaKsAOUqWK0I"
                  const val SHIZUKU_PKG = "moe.shizuku.privileged.api"
                  const val NEED = "Aktifkan dan beri akses Shizuku dulu di tab Settings"
              }

              // ---- Palet biru ----
              private val cBg = 0xFFF0F4FA.toInt()
              private val cCard = 0xFFFFFFFF.toInt()
              private val cInk = 0xFF0F1B2D.toInt()
              private val cMuted = 0xFF5B6B80.toInt()
              private val cLine = 0xFFDCE5F0.toInt()
              private val cSoft = 0xFFE8EFF8.toInt()
              private val cDark = 0xFF1D4ED8.toInt()
              private val cWhite = 0xFFFFFFFF.toInt()
              private val cGreen = 0xFF22A559.toInt()
              private val cAmber = 0xFFE69A12.toInt()
              private val cRed = 0xFFDC3B3B.toInt()

              private lateinit var prefs: SharedPreferences
              private val pages = mutableListOf<View>()
              private val navs = mutableListOf<LinearLayout>()
              private val h = Handler(Looper.getMainLooper())

              private class Info(val value: TextView, val sub: TextView)
              private class Chips(val btns: List<TextView>)

              // Home
              private lateinit var iDevice: Info
              private lateinit var iAndroid: Info
              private lateinit var iBat: Info
              private lateinit var iTemp: Info
              private lateinit var iScreen: Info
              private lateinit var iNet: Info
              private lateinit var batFill: View
              private lateinit var batRest: View
              private lateinit var pillDot: View
              private lateinit var pillText: TextView

              // Tools
              private var apps: List<AppItem> = emptyList()
              private lateinit var appBox: LinearLayout
              private lateinit var search: EditText
              private lateinit var chAnim: Chips
              private lateinit var chSaver: Chips
              private lateinit var chTimeout: Chips
              private lateinit var chBright: Chips
              private lateinit var swScan: Switch
              private lateinit var swCaptive: Switch
              private lateinit var swNetRec: Switch
              private lateinit var swWifiSus: Switch
              private lateinit var swHw: Switch
              private lateinit var swAutoStop: Switch
              private lateinit var swAutoCompact: Switch
              private lateinit var swRr: Switch
              private lateinit var chPointer: Chips
              private lateinit var rrBox: LinearLayout
              private val sums = HashMap<String, TextView>()
              private val longPress = listOf(400, 300, 200)
              private val pointerSp = listOf(0, 3, 6)
              private lateinit var swAuto: Switch
              private lateinit var chHours: Chips
              private lateinit var vLast: TextView
              private lateinit var heroBtn: TextView
              private lateinit var heavyBox: LinearLayout
              private lateinit var vRam: TextView
              private class Heavy(val label: String, val pkg: String, val mb: Int)
              private var heavy: List<Heavy> = emptyList()
              private var heavyAt = 0L

              // Settings
              private lateinit var vDot: View
              private lateinit var vState: TextView
              private lateinit var vStateSub: TextView
              private lateinit var vTest: TextView

              private val timeouts = listOf(15000, 30000, 60000, 120000)
              private val brights = listOf(64, 128, 191, 255)

              private val tick = object : Runnable {
                  override fun run() {
                      updateInfo()
                      h.postDelayed(this, 3000)
                  }
              }

              private val onReceived = Shizuku.OnBinderReceivedListener { runOnUiThread { refreshStatus() } }
              private val onDead = Shizuku.OnBinderDeadListener {
                  runOnUiThread { refreshStatus() }
                  if (prefs.getBoolean("notif", true)) notifyDead()
              }
              private val onPerm = Shizuku.OnRequestPermissionResultListener { _, _ -> runOnUiThread { refreshStatus() } }

              // ======================= Lifecycle =======================

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = cBg
                  window.navigationBarColor = cBg
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  prefs = getSharedPreferences("kreji", MODE_PRIVATE)
                  createChannel()
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }

                  val root = FrameLayout(this)
                  root.setBackgroundColor(cBg)
                  pages += buildHome()
                  pages += buildTools()
                  pages += buildSettings()
                  pages.forEach { root.addView(it, FrameLayout.LayoutParams(MATCH, MATCH)) }
                  val navLp = FrameLayout.LayoutParams(MATCH, WRAP, Gravity.BOTTOM)
                  navLp.setMargins(dp(28), 0, dp(28), dp(16))
                  root.addView(buildNav(), navLp)
                  setContentView(root)

                  Shizuku.addBinderReceivedListenerSticky(onReceived)
                  Shizuku.addBinderDeadListener(onDead)
                  Shizuku.addRequestPermissionResultListener(onPerm)

                  loadApps()
                  TurboService.sync(this)
                  show(0)
              }

              override fun onResume() {
                  super.onResume()
                  h.post(tick)
                  refreshStatus()
                  refreshTools()
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(tick)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  Shizuku.removeBinderReceivedListener(onReceived)
                  Shizuku.removeBinderDeadListener(onDead)
                  Shizuku.removeRequestPermissionResultListener(onPerm)
              }

              // ======================= Helper UI =======================

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun font(bold: Boolean): Typeface =
                  Typeface.create(if (bold) "sans-serif-medium" else "sans-serif", Typeface.NORMAL)

              private fun shape(color: Int, radius: Int, stroke: Int? = null): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                      if (stroke != null) setStroke(dp(1), stroke)
                  }

              private fun ripple(d: GradientDrawable): RippleDrawable =
                  RippleDrawable(ColorStateList.valueOf(0x22000000), d, null)

              private fun tv(text: String, size: Float = 14f, color: Int = cInk, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      typeface = font(bold)
                  }

              private fun icon(res: Int, sizeDp: Int, color: Int): ImageView = ImageView(this).apply {
                  setImageResource(res)
                  setColorFilter(color)
                  layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
              }

              private fun lp(top: Int = 0): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(top) }

              private fun card(): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = shape(cCard, 24, cLine)
                  setPadding(dp(18), dp(18), dp(18), dp(18))
                  elevation = dp(1).toFloat()
              }

              private fun section(title: String): TextView =
                  tv(title.uppercase(), 11f, cMuted, true).apply {
                      letterSpacing = 0.14f
                      setPadding(dp(4), 0, 0, 0)
                  }

              private fun btn(text: String, filled: Boolean = true, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      this.text = text
                      gravity = Gravity.CENTER
                      textSize = 14f
                      typeface = font(true)
                      setTextColor(if (filled) cWhite else cInk)
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      background = ripple(shape(if (filled) cDark else cSoft, 16))
                      setOnClickListener { onClick() }
                  }

              private fun linkRow(title: String, sub: String, onClick: () -> Unit): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(13), dp(12), dp(13))
                      background = ripple(shape(cSoft, 16))
                      val c = LinearLayout(context).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(tv(title, 14f, cInk, true))
                          addView(tv(sub, 12f, cMuted))
                      }
                      addView(c, LinearLayout.LayoutParams(0, WRAP, 1f))
                      addView(icon(R.drawable.ic_chevron, 20, cMuted))
                      setOnClickListener { onClick() }
                  }

              private fun chipGroup(labels: List<String>, onPick: (Int) -> Unit): Pair<LinearLayout, Chips> {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val list = mutableListOf<TextView>()
                  labels.forEachIndexed { i, l ->
                      val b = TextView(this).apply {
                          text = l
                          gravity = Gravity.CENTER
                          textSize = 13f
                          typeface = font(true)
                          setPadding(dp(6), dp(12), dp(6), dp(12))
                          setOnClickListener { onPick(i) }
                      }
                      list += b
                      row.addView(b, LinearLayout.LayoutParams(0, WRAP, 1f).apply { if (i > 0) leftMargin = dp(8) })
                  }
                  val c = Chips(list)
                  mark(c, -1)
                  return Pair(row, c)
              }

              private fun mark(c: Chips, sel: Int) {
                  c.btns.forEachIndexed { i, b ->
                      val on = i == sel
                      b.background = ripple(shape(if (on) cDark else cSoft, 14))
                      b.setTextColor(if (on) cWhite else cInk)
                  }
              }

              private fun toggleRow(
                  label: String, desc: String, checked: Boolean, needsShizuku: Boolean, onChange: (Boolean) -> Unit
              ): Pair<LinearLayout, Switch> {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(tv(label, 14f, cInk, true))
                      addView(tv(desc, 12f, cMuted), lp(2))
                  }
                  row.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f).apply { rightMargin = dp(12) })
                  val sw = Switch(this)
                  sw.isChecked = checked
                  sw.trackTintList = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(cDark, 0xFFC9CED6.toInt())
                  )
                  sw.thumbTintList = ColorStateList.valueOf(cWhite)
                  sw.setOnClickListener {
                      if (needsShizuku && state() != 2) {
                          sw.isChecked = !sw.isChecked
                          toast(NEED)
                      } else onChange(sw.isChecked)
                  }
                  row.addView(sw)
                  return Pair(row, sw)
              }

              private fun pageShell(): Pair<ScrollView, LinearLayout> {
                  val sv = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                      clipToPadding = false
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(22), dp(20), dp(120))
                  }
                  sv.addView(col, ViewGroup.LayoutParams(MATCH, WRAP))
                  return Pair(sv, col)
              }

              private fun newInfo() = Info(tv("-", 18f, cInk, true), tv("", 12f, cMuted))

              private fun infoCard(label: String, i: Info): LinearLayout = card().apply {
                  setPadding(dp(16), dp(15), dp(16), dp(15))
                  addView(tv(label.uppercase(), 10.5f, cMuted, true).apply { letterSpacing = 0.1f })
                  addView(i.value, lp(7))
                  addView(i.sub, lp(2))
              }

              private fun row2(a: View, b: View): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  addView(a, LinearLayout.LayoutParams(0, MATCH, 1f))
                  addView(b, LinearLayout.LayoutParams(0, MATCH, 1f).apply { leftMargin = dp(12) })
              }

              private fun dot(color: Int, sizeDp: Int): View = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
                  background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(color) }
              }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()

              private fun openUrl(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                  } catch (e: Throwable) {
                      toast("Tidak bisa membuka link")
                  }
              }

              private fun openIntent(i: Intent) {
                  try {
                      startActivity(i)
                  } catch (e: Throwable) {
                      toast("Pengaturan tidak tersedia di HP ini")
                  }
              }

              // ======================= Navigasi floating =======================

              private fun buildNav(): LinearLayout {
                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = shape(cCard, 36, cLine)
                      elevation = dp(14).toFloat()
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  listOf(
                      Pair(R.drawable.ic_home, "Home"),
                      Pair(R.drawable.ic_tools, "Tools"),
                      Pair(R.drawable.ic_settings, "Settings")
                  ).forEachIndexed { i, (res, label) ->
                      val item = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(9), 0, dp(8))
                          addView(icon(res, 22, cMuted))
                          addView(tv(label, 11f, cMuted, true).apply { gravity = Gravity.CENTER }, lp(3))
                          setOnClickListener { show(i) }
                      }
                      nav.addView(item, LinearLayout.LayoutParams(0, WRAP, 1f).apply { setMargins(dp(3), 0, dp(3), 0) })
                      navs += item
                  }
                  return nav
              }

              private fun show(index: Int) {
                  pages.forEachIndexed { i, p ->
                      p.visibility = if (i == index) View.VISIBLE else View.GONE
                      if (i == index) {
                          p.alpha = 0f
                          p.animate().alpha(1f).setDuration(180).start()
                      }
                  }
                  navs.forEachIndexed { i, item ->
                      val sel = i == index
                      item.background = if (sel) shape(cDark, 28) else null
                      (item.getChildAt(0) as ImageView).setColorFilter(if (sel) cWhite else cMuted)
                      (item.getChildAt(1) as TextView).setTextColor(if (sel) cWhite else cMuted)
                  }
                  if (index == 2) refreshStatus()
                  if (index == 1) {
                      refreshTools()
                      loadHeavy(false)
                  }
              }

              // ======================= HOME =======================

              private fun buildHome(): ScrollView {
                  val (sv, col) = pageShell()

                  val head = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  head.addView(tv("Kreji", 32f, cInk, true))
                  head.addView(tv("TURBO", 11f, cWhite, true).apply {
                      letterSpacing = 0.12f
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      background = shape(cDark, 10)
                  }, LinearLayout.LayoutParams(WRAP, WRAP).apply { leftMargin = dp(10); topMargin = dp(6) })
                  col.addView(head)
                  col.addView(tv("Performa maksimal, tetap terkendali", 13f, cMuted), lp(2))

                  // pill status shizuku
                  val pill = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      background = ripple(shape(cCard, 20, cLine))
                      setOnClickListener { show(2) }
                  }
                  pillDot = dot(cRed, 10)
                  pill.addView(pillDot, LinearLayout.LayoutParams(dp(10), dp(10)).apply { rightMargin = dp(10) })
                  pillText = tv("Shizuku", 13f, cInk, true)
                  pill.addView(pillText, LinearLayout.LayoutParams(0, WRAP, 1f))
                  pill.addView(icon(R.drawable.ic_chevron, 18, cMuted))
                  col.addView(pill, lp(18))

                  col.addView(section("Info perangkat"), lp(26))
                  iDevice = newInfo(); iAndroid = newInfo(); iBat = newInfo()
                  iTemp = newInfo(); iScreen = newInfo(); iNet = newInfo()

                  col.addView(row2(infoCard("Merek / Model", iDevice), infoCard("Android", iAndroid)), lp(10))

                  // baterai + progress bar
                  val batCard = infoCard("Baterai", iBat)
                  val track = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      weightSum = 100f
                      background = shape(cSoft, 4)
                  }
                  batFill = View(this).apply { background = shape(cDark, 4) }
                  batRest = View(this)
                  track.addView(batFill, LinearLayout.LayoutParams(0, dp(6), 0f))
                  track.addView(batRest, LinearLayout.LayoutParams(0, dp(6), 100f))
                  batCard.addView(track, lp(10))
                  col.addView(row2(batCard, infoCard("Suhu", iTemp)), lp(12))
                  col.addView(row2(infoCard("Layar", iScreen), infoCard("Jaringan", iNet)), lp(12))

                  col.addView(section("Developer"), lp(26))
                  val dev = card()
                  val devTop = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  devTop.addView(tv("LK", 15f, cWhite, true).apply {
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(cDark) }
                  }, LinearLayout.LayoutParams(dp(46), dp(46)).apply { rightMargin = dp(14) })
                  val devCol = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  devCol.addView(tv("LutfiKreji", 18f, cInk, true))
                  devCol.addView(tv("Developer Kreji Turbo", 12f, cMuted))
                  devTop.addView(devCol)
                  dev.addView(devTop)
                  dev.addView(linkRow("TikTok", "@lutfikreji") { openUrl(TIKTOK) }, lp(16))
                  dev.addView(linkRow("Saluran Info", "LutfiKreji di WhatsApp") { openUrl(WA) }, lp(8))
                  col.addView(dev, lp(10))
                  return sv
              }

              private fun updateInfo() {
                  iDevice.value.text = Build.MANUFACTURER.replaceFirstChar { it.uppercase() }
                  iDevice.sub.text = Build.MODEL
                  iAndroid.value.text = "Android ${Build.VERSION.RELEASE}"
                  iAndroid.sub.text = "API ${Build.VERSION.SDK_INT}"

                  val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  if (b != null) {
                      val lvl = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                      val sc = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                      val st = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                      val chg = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                      val pct = (if (sc > 0) lvl * 100 / sc else lvl).coerceIn(0, 100)
                      iBat.value.text = "$pct%"
                      iBat.sub.text = if (chg) "Sedang mengisi" else "Tidak mengisi"
                      (batFill.layoutParams as LinearLayout.LayoutParams).weight = pct.toFloat()
                      (batRest.layoutParams as LinearLayout.LayoutParams).weight = (100 - pct).toFloat()
                      batFill.background = shape(if (pct <= 20 && !chg) cRed else cDark, 4)
                      batFill.requestLayout()
                      batRest.requestLayout()

                      val t = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10f
                      iTemp.value.text = String.format(Locale.US, "%.1f °C", t)
                      iTemp.sub.text = if (t >= 40f) "Panas" else if (t >= 35f) "Hangat" else "Normal"
                      iTemp.sub.setTextColor(if (t >= 40f) cRed else if (t >= 35f) cAmber else cMuted)
                  }

                  val dm = resources.displayMetrics
                  @Suppress("DEPRECATION")
                  val hz = windowManager.defaultDisplay.refreshRate
                  iScreen.value.text = "${hz.roundToInt()} Hz"
                  iScreen.sub.text = "${dm.widthPixels} x ${dm.heightPixels} · ${dm.densityDpi} dpi"

                  val cm = getSystemService(ConnectivityManager::class.java)
                  val net = cm.activeNetwork
                  val nc = if (net != null) cm.getNetworkCapabilities(net) else null
                  val mbps = if (nc != null) "${nc.linkDownstreamBandwidthKbps / 1000} Mbps" else ""
                  when {
                      nc == null -> { iNet.value.text = "Offline"; iNet.sub.text = "Tidak ada koneksi" }
                      nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> { iNet.value.text = "Wi-Fi"; iNet.sub.text = mbps }
                      nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> { iNet.value.text = "Seluler"; iNet.sub.text = mbps }
                      nc.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) -> { iNet.value.text = "Ethernet"; iNet.sub.text = mbps }
                      else -> { iNet.value.text = "Terhubung"; iNet.sub.text = mbps }
                  }
              }

