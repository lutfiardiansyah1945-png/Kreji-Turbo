              private fun refreshStatus() {
                  val s = state()
                  val color = when (s) { 2 -> cGreen; 1 -> cAmber; else -> cRed }
                  val label = when (s) { 2 -> "Aktif"; 1 -> "Belum diizinkan"; else -> "Mati" }
                  val sub = when (s) {
                      2 -> "Terhubung dan sudah diizinkan"
                      1 -> "Shizuku menyala, tekan Beri akses"
                      else -> "Shizuku belum berjalan"
                  }
                  if (::pillDot.isInitialized) {
                      pillDot.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(color) }
                      pillText.text = "Shizuku  ·  $label"
                  }
                  if (!::vState.isInitialized) return
                  vDot.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(color) }
                  vState.text = label
                  vState.setTextColor(color)
                  vStateSub.text = sub
              }

              private fun requestAccess() {
                  when (state()) {
                      0 -> toast("Shizuku belum menyala. Buka Shizuku lalu tekan Start.")
                      1 -> try {
                          Shizuku.requestPermission(100)
                      } catch (e: Throwable) {
                          toast("Gagal meminta akses: ${e.message}")
                      }
                      else -> toast("Akses sudah diberikan")
                  }
              }

              private fun openShizuku() {
                  val i = packageManager.getLaunchIntentForPackage(SHIZUKU_PKG)
                  if (i != null) startActivity(i)
                  else {
                      toast("Shizuku belum terpasang")
                      openUrl("https://play.google.com/store/apps/details?id=$SHIZUKU_PKG")
                  }
              }

              private fun testConnection() {
                  if (state() != 2) {
                      vTest.text = "Gagal: Shizuku belum aktif atau belum diizinkan"
                      vTest.setTextColor(cRed)
                      return
                  }
                  vTest.text = "Menjalankan tes..."
                  vTest.setTextColor(cMuted)
                  Thread {
                      val t0 = System.currentTimeMillis()
                      val out = sh("id; echo \"model: \$(getprop ro.product.model)\"; echo \"android: \$(getprop ro.build.version.release)\"")
                      val ms = System.currentTimeMillis() - t0
                      runOnUiThread {
                          val ok = !out.startsWith("ERR")
                          vTest.text = (if (ok) "Berhasil, terhubung ($ms ms)\n" else "Gagal\n") + out
                          vTest.setTextColor(if (ok) 0xFF15803D.toInt() else cRed)
                      }
                  }.start()
              }

              // ======================= Shizuku core =======================

              private fun state(): Int = Sh.state()

              private fun sh(cmd: String): String = Sh.exec(cmd)

              private fun runShRaw(cmd: String, done: (String) -> Unit) {
                  if (state() != 2) {
                      toast(NEED)
                      return
                  }
                  Thread {
                      val r = sh(cmd)
                      runOnUiThread { done(r) }
                  }.start()
              }

              private fun runSh(cmd: String, ok: String, onOk: (() -> Unit)? = null) {
                  runShRaw(cmd) { r ->
                      if (r.startsWith("ERR")) toast(r) else {
                          toast(ok)
                          onOk?.invoke()
                      }
                  }
              }

              // ======================= Notifikasi =======================

              private fun createChannel() {
                  val ch = NotificationChannel(CH, "Status Shizuku", NotificationManager.IMPORTANCE_HIGH)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              }

              private fun notifyDead() {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle("Shizuku mati")
                      .setContentText("Fitur Kreji Turbo tidak bisa dipakai. Buka Shizuku lalu Start lagi.")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  try {
                      getSystemService(NotificationManager::class.java).notify(7, n)
                  } catch (e: Throwable) {
                  }
              }
          }
